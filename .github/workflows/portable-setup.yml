name: Portable setup

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The runner context is not available in job-level env; using
      # runner.temp there makes GitHub reject the whole workflow file.
      - name: Isolate agent directory and command prefix
        shell: bash
        run: |
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-agent" >> "$GITHUB_ENV"
          echo "npm_config_prefix=$RUNNER_TEMP/pi-prefix" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Preview fresh installation
        run: npm run setup -- --dry-run
      - name: Install into isolated agent directory and command prefix
        run: npm run setup
      - name: Check installed Pi version
        run: npm run setup:doctor
      - name: Installer regression tests
        run: npm run test:setup
      - name: Typecheck
        run: npm run check
      - name: Fresh-home Pi startup
        run: npm run test:setup:smoke
